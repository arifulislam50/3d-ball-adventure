# Codemagic CI/CD for Marblo: Island Roll (formerly 3D Ball Adventure)
#
# Technology (NOT Flutter):
#   - Game engine : Three.js (WebGL 3D)   -> src/
#   - Bundler     : Vite 7                -> builds the game into dist/
#   - Android     : Capacitor 8           -> android/ (committed, with icons & signing setup)
#
# Outputs of every build:
#   - .aab  -> upload this to Google Play Console
#   - .apk  -> install this directly on your phone for testing
#
# Workflows (choose one when you tap "Start new build"):
#   1. android-release-quick  : zero setup. Creates a NEW signing key and gives it
#                                to you as a download. Use it ONCE, for the first build.
#   2. android-release        : uses YOUR keystore uploaded to Codemagic
#                                (reference name: ball_keystore). Use this for every
#                                build you send to Google Play.
#
# The app's versionCode = Codemagic's PROJECT_BUILD_NUMBER, so it always increases.

definitions:
  env: &env
    node: 22
    java: 21

  scripts:
    - &install_build_web
      name: Install dependencies and build the game (Vite)
      script: |
        set -e
        npm ci --no-audit --no-fund || npm install --no-audit --no-fund
        npm run build

    - &cap_sync
      name: Copy the game into the Android project (Capacitor)
      script: |
        set -e
        npx cap sync android
        echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
        chmod +x android/gradlew

    - &gradle_build
      name: Build signed AAB + APK (Gradle)
      script: |
        set -e
        cd android
        ./gradlew bundleRelease assembleRelease --no-daemon
        cd ..
        mkdir -p output
        N=${PROJECT_BUILD_NUMBER:-1}
        cp android/app/build/outputs/bundle/release/app-release.aab "output/marblo-$N.aab"
        cp android/app/build/outputs/apk/release/app-release.apk "output/marblo-$N.apk"
        BT=$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -n 1)
        "$ANDROID_SDK_ROOT/build-tools/$BT/apksigner" verify --print-certs "output/marblo-$N.apk" || true
        ls -la output

workflows:
  # ---------------------------------------------------------------
  # 1) QUICK: first build only. Gives you a keystore to keep forever.
  # ---------------------------------------------------------------
  android-release-quick:
    name: Android Release (quick, creates new key)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *env
    scripts:
      - *install_build_web
      - *cap_sync
      - name: Create a signing key (keystore)
        script: |
          set -e
          mkdir -p output
          KS="$CM_BUILD_DIR/output/marblo-upload-key.jks"
          ALIAS="marblo"
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -v -keystore "$KS" -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Marblo, O=arifulislam50, C=BD"
          cat > "$CM_BUILD_DIR/output/KEYSTORE-INFO.txt" <<EOF
          Keystore file : marblo-upload-key.jks
          Key alias     : $ALIAS
          Keystore pass : $PASS
          Key password  : $PASS
          KEEP THIS FILE AND THE .jks FILE PRIVATE AND SAFE. If you lose them you
          cannot update your app on Google Play with this key.
          Upload the .jks to Codemagic (reference name: ball_keystore) and use the
          "android-release" workflow for all future builds.
          EOF
          echo "CM_KEYSTORE_PATH=$KS" >> $CM_ENV
          echo "CM_KEY_ALIAS=$ALIAS" >> $CM_ENV
          echo "CM_KEYSTORE_PASSWORD=$PASS" >> $CM_ENV
          echo "CM_KEY_PASSWORD=$PASS" >> $CM_ENV
      - *gradle_build
    artifacts:
      - output/*.aab
      - output/*.apk
      - output/*.jks
      - output/KEYSTORE-INFO.txt

  # ---------------------------------------------------------------
  # 2) PERMANENT: Codemagic > Team settings > codemagic.yaml settings >
  #    Code signing identities > Android keystores > reference: ball_keystore
  # ---------------------------------------------------------------
  android-release:
    name: Android Release (signed with ball_keystore)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *env
      android_signing:
        - ball_keystore
    scripts:
      - *install_build_web
      - *cap_sync
      - *gradle_build
    artifacts:
      - output/*.aab
      - output/*.apk
